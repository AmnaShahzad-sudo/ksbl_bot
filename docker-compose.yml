version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ksbl-bot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      - ./prompts:/app/prompts
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
